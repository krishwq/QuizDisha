<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for Emblem & Text -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="35%" stop-color="#eec758"/>
      <stop offset="70%" stop-color="#c99528"/>
      <stop offset="100%" stop-color="#f8d66e"/>
    </linearGradient>

    <!-- Deep Red Gradient for Crescent Swoosh -->
    <linearGradient id="redSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Navy Base Background -->
  <rect width="100%" height="100%" fill="#070c1e" rx="32"/>

  <!-- Crescent Red Swoosh -->
  <path d="M 230 65 C 130 65, 80 135, 95 245 C 105 320, 165 375, 275 365 C 235 345, 175 315, 160 230 C 148 165, 185 95, 230 65 Z" fill="url(#redSwoosh)" />

  <!-- Central Star -->
  <polygon points="250,55 255,75 275,80 255,85 250,105 245,85 225,80 245,75" fill="url(#goldGrad)" />

  <!-- Left Star -->
  <polygon points="215,82 218,94 230,97 218,100 215,112 212,100 200,97 212,94" fill="url(#goldGrad)" />

  <!-- Right Star -->
  <polygon points="285,82 288,94 300,97 288,100 285,112 282,100 270,97 282,94" fill="url(#goldGrad)" />

  <!-- Mortarboard Cap (Graduation Hat) -->
  <polygon points="250,108 320,132 250,154 180,132" fill="url(#goldGrad)" />
  <polygon points="205,140 250,165 295,140 295,148 250,173 205,148" fill="#c99528" />

  <!-- Tassel -->
  <path d="M 195 136 L 190 170 L 194 172 L 198 170 L 195 136" fill="url(#goldGrad)" />
  <circle cx="194" cy="173" r="2.5" fill="#fff0a6" />

  <!-- Head -->
  <circle cx="250" cy="172" r="19" fill="url(#goldGrad)" />

  <!-- Left Wing / Scholar Arm rising upwards -->
  <path d="M 245 285 C 220 220, 180 190, 155 178 C 185 210, 205 250, 225 305 Z" fill="url(#goldGrad)" />

  <!-- Right Wing / Scholar Arm rising upwards -->
  <path d="M 255 285 C 280 220, 320 190, 345 178 C 315 210, 295 250, 275 305 Z" fill="url(#goldGrad)" />

  <!-- Central Torso Rising Accent -->
  <path d="M 243 285 C 243 240, 246 205, 250 196 C 254 205, 257 240, 257 285 Z" fill="url(#goldGrad)" />

  <!-- Open Book Base - Left Page -->
  <path d="M 246 322 C 205 316, 155 316, 120 338 L 140 285 C 175 272, 215 272, 246 288 Z" fill="#0b1329" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round" />

  <!-- Open Book Base - Right Page -->
  <path d="M 254 322 C 295 316, 345 316, 380 338 L 360 285 C 325 272, 285 272, 254 288 Z" fill="#0b1329" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round" />

  <!-- Book Spine Center Fold -->
  <path d="M 250 288 L 250 332" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Brand Name: QUIZDISHA -->
  <text x="250" y="405" font-family="'Times New Roman', 'Cinzel', 'Georgia', serif" font-size="44" font-weight="bold" letter-spacing="4" fill="url(#goldGrad)" text-anchor="middle">QUIZDISHA</text>

  <!-- Tagline: LEARN PLAY WIN -->
  <text x="250" y="445" font-family="'Montserrat', 'Arial', sans-serif" font-size="19" font-weight="700" letter-spacing="10" fill="#ef4444" text-anchor="middle">LEARN PLAY WIN</text>
</svg>
